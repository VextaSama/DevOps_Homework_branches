vrrp_script chk_nginx {
    script "/home/vexta/check_nginx.sh"
    interval 3
    timeout 2
    fall 2
    rise 1
}

vrrp_instance VI_1 {
        state MASTER
        interface enp0s3
        virtual_router_id 60
        priority 255
        advert_int 1

        virtual_ipaddress {
              192.168.0.60/24
        }

        track_script {
              chk_nginx
    }
}

